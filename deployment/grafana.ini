[date_formats]
default_timezone = UTC
[server]
root_url = REPLACE_WITH_YOUR_GRAFANA_PUBLIC_URL
[auth.google]
enabled = true
client_id = REPLACE_WITH_YOUR_GOOGLE_OAUTH_CLIENT_ID
client_secret = REPLACE_WITH_YOUR_GOOGLE_OAUTH_CLIENT_SECRET
scopes = https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/userinfo.email
auth_url = https://accounts.google.com/o/oauth2/auth
token_url = https://accounts.google.com/o/oauth2/token
allowed_domains = REPLACE_WITH_YOUR_ALLOWED_EMAIL_DOMAIN
allow_sign_up = true

[plugins]
enable_alpha = true
app_tls_skip_verify_insecure = false
# Enter a comma-separated list of plugin identifiers to identify plugins to load even if they are unsigned. Plugins with modified signatures are never loaded.
allow_loading_unsigned_plugins = openobserve
